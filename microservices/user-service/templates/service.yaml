apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-user-service
  namespace: {{ .Values.namespace }}
  labels:
    app: user-service
    environment: {{ .Values.environment }}
    team: {{ .Values.team }}
  annotations:
    description: "Servicio de gestión de usuarios"
    {{- if .Values.service.annotations }}
    {{- range $key, $value := .Values.service.annotations }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{ .Values.service.clusterIP | default "None" }}
  sessionAffinity: {{ .Values.service.sessionAffinity | default "None" }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    app: user-service
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-user-service-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: user-service
    purpose: headless
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
  selector:
    app: user-service
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Release.Name }}-user-service
  namespace: {{ .Values.namespace }}
subsets:
  - addresses:
      - ip: "10.0.0.1"
      - ip: "10.0.0.2"
      - ip: "10.0.0.3"
    ports:
      - port: {{ .Values.service.port }}
        protocol: TCP
        name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-user-service-network-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53