apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    name: platform
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: platform
data:
  cluster-name: "microservices-platform"
  region: "us-east-1"
  availability-zones: "us-east-1a,us-east-1b,us-east-1c"
  node-pool-default: "general-purpose"
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: platform
type: Opaque
stringData:
  aws-access-key: "${AWS_ACCESS_KEY_ID}"
  aws-secret-key: "${AWS_SECRET_ACCESS_KEY}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-admin
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin-binding
subjects:
  - kind: ServiceAccount
    name: cluster-admin
    namespace: platform
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: platform
spec:
  limits:
    - default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      type: Container
    - max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "100m"
        memory: "256Mi"
      type: Pod
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: platform
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    pods: "100"
    services: "50"
    configmaps: "20"
    secrets: "20"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-hpa
  namespace: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placeholder
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: PodDisruptionBudget
metadata:
  name: platform-pdb
  namespace: platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: platform
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-network-policy
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-labels
  namespace: platform
data:
  node-selector.yaml: |
    node-pools:
      general-purpose:
        labels:
          node.kubernetes.io/pool: general
        taints: []
      memory-intensive:
        labels:
          node.kubernetes.io/pool: memory
        taints:
          - key: workload
            value: memory-intensive
            effect: NoSchedule
      compute-intensive:
        labels:
          node.kubernetes.io/pool: compute
        taints:
          - key: workload
            value: compute-intensive
            effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: platform-internal
  namespace: platform
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: platform
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: platform-service
  namespace: platform
subsets: []