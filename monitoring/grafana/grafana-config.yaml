apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
    component: config
data:
  grafana.ini: |-
    [server]
    protocol = http
    http_addr = 0.0.0.0
    http_port = 3000
    domain = grafana.monitoring.svc.cluster.local
    root_url = %(protocol)s://%(domain)s/
    enable_gzip = true
    
    [database]
    type = sqlite3
    path = /var/lib/grafana/grafana.db
    cache_mode = private
    
    [session]
    provider = file
    
    [analytics]
    reporting_enabled = false
    check_for_updates = true
    
    [security]
    admin_user = admin
    admin_password = ${GRAFANA_ADMIN_PASSWORD}
    disable_gravatar = true
    cookie_secure = false
    cookie_samesite = lax
    
    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    default_theme = dark
    
    [auth.anonymous]
    enabled = false
    
    [auth.basic]
    enabled = true
    
    [auth]
    disable_login_form = false
    disable_signout_menu = false
    
    [log]
    mode = console
    level = info
    
    [log.console]
    level = info
    format = text
    
    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default/kubernetes-overview.json
    
    [unified_alerting]
    enabled = true
    
    [alerting]
    enabled = false
    
    [feature_toggles]
    enable = live
    
    [metrics]
    enabled = true
    interval_seconds = 10
    
    [grafana_net]
    url = https://grafana.net

  datasources.yml: |-
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
          queryTimeout: 60s
          manageAlerts: true
          prometheusType: Prometheus
          prometheusVersion: 2.47.0
          cacheTimeout: 30s
          httpMode: POST
        secureJsonData: {}
        version: 1
        readOnly: false
        uid: prometheus-main

  provisioning.yml: |-
    apiVersion: 1
    
    providers:
      - name: 'Dashboards Provider'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
      
      - name: 'Datasource Provider'
        orgId: 1
        name: 'Datasource Provider'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/datasources

  dashboard-providers.yml: |-
    apiVersion: 1
    
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: true
            updateIntervalSeconds: 30
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/default
              foldersFromFilesStructure: true
          - name: 'kubernetes'
            orgId: 1
            folder: 'Kubernetes'
            type: file
            disableDeletion: true
            updateIntervalSeconds: 30
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
              foldersFromFilesStructure: true
          - name: 'microservices'
            orgId: 1
            folder: 'Microservicios'
            type: file
            disableDeletion: true
            updateIntervalSeconds: 30
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/microservices
              foldersFromFilesStructure: true

  notifiers.yml: |-
    apiVersion: 1
    
    notifiers:
      - name: 'Alertas Slack'
        type: slack
        uid: slack-notifier
        is_default: true
        send_reminder: true
        frequency: 4h
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#alertas-monitoreo'
          username: 'Grafana Alerts'
          icon_emoji: ':warning:'
          mentionChannel: 'channel'
          uploadImage: true
      
      - name: 'Alertas Email'
        type: email
        uid: email-notifier
        is_default: false
        settings:
          addresses: devops-team@empresa.com;oncall@empresa.com
          singleEmail: false
          uploadImage: true

  alert-notifications.yml: |-
    apiVersion: 1
    
    alert_notifications:
      - id: 1
        name: 'Slack Alerts'
        type: slack
        is_default: true
        send_reminder: true
        frequency: 4h
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#alertas-monitoreo'
      - id: 2
        name: 'Email Alerts'
        type: email
        is_default: false
        settings:
          addresses: devops-team@empresa.com
          singleEmail: false